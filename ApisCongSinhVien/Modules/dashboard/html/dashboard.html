<script type="text/javascript">
    // Canh bao no hoc phi: chi hien voi sinh vien, khi NOCO < 0 (no = NOCO am).
    // Quy uoc NOCO: tham chieu tinhhinhhocphi.js dong 898-903.
    (function () {
        var TAG = '[CanhBaoNoHocPhi]';
        if (!window.edu || !edu.system || !edu.system.userId || edu.system.iM == null || !edu.system.appCode || typeof edu.system.makeRequest !== 'function') {
            console.warn(TAG, 'edu.system chua san sang khi dashboard.html load');
            return;
        }
        if (isLikelyCanBo()) {
            console.log(TAG, 'Skip: tai khoan duoc nhan dien la can bo');
            return;
        }
        fetchTinhTrangTaiChinh();

        function isLikelyCanBo() {
            var c = (edu.system.appCode || '').toLowerCase();
            return c.indexOf('canbo') >= 0
                || c.indexOf('giangvien') >= 0
                || c.indexOf('nhansu') >= 0
                || c === 'cb' || c === 'gv' || c === 'ns';
        }

        function fetchTinhTrangTaiChinh() {
            var oReq = {
                action: 'TC_ThongTin_MH/DSA4BRIVKC8pFTMgLyYVICgCKSgvKQPP',
                func: 'pkg_taichinh_thongtin.LayDSTinhTrangTaiChinh',
                iM: edu.system.iM,
                strQLSV_NguoiHoc_Id: edu.system.userId,
                strNguoiThucHien_Id: edu.system.userId,
                strNguonDuLieu_Id: ''
            };
            edu.system.makeRequest({
                success: function (d) {
                    if (!d || !d.Success || !d.Data || !d.Data.rsThongTin || !d.Data.rsThongTin.length) return;
                    var dNoCo = parseFloat(d.Data.rsThongTin[0].NOCO);
                    if (!isNaN(dNoCo) && dNoCo < 0) showModalCanhBao(Math.abs(dNoCo));
                },
                error: function (er) { console.error(TAG, 'API loi', er); },
                type: 'POST', action: oReq.action, contentType: true, data: oReq, fakedb: []
            }, false, false, false, null);
        }

        function formatTien(n) {
            try {
                if (edu.util && typeof edu.util.formatCurrency === 'function') return edu.util.formatCurrency(n);
            } catch (e) {}
            return (n || 0).toLocaleString('vi-VN');
        }

        function goToHocPhi() {
            var $a = $('#sidebar-menu .sidebar-menu-sub > a').filter(function () {
                var t = ($(this).text() || '').toLowerCase();
                return t.indexOf('tình hình học phí') >= 0 || t.indexOf('tinh hinh hoc phi') >= 0 || t.indexOf('học phí') >= 0;
            }).first();
            if ($a.length) $a[0].click();
        }

        function goToThanhToan() {
            // Tim menu Thanh toan trong sidebar (vd: "Thanh toán hoc phi", "Thanh toan truc tuyen"...)
            var $a = $('#sidebar-menu .sidebar-menu-sub > a').filter(function () {
                var t = ($(this).text() || '').toLowerCase();
                return t.indexOf('thanh toán') >= 0 || t.indexOf('thanh toan') >= 0;
            }).first();
            if ($a.length) {
                $a[0].click();
                return;
            }
            // Fallback (CMC khong co menu Thanh toan): mo trang Tinh hinh hoc phi
            // roi auto-trigger nut "Chi tiet" cua card "Tong no chung cac khoan"
            // de SV thay luon danh sach can tra + nut QR thanh toan tung khoan.
            goToHocPhi();
            autoOpenNoChungModal();
        }

        function autoOpenNoChungModal() {
            var iAttempt = 0;
            var iv = setInterval(function () {
                iAttempt++;
                var $btn = $('.btnDetail_NoChungCacKhoan').first();
                var thp = window.main_doc && window.main_doc.TinhHinhHocPhi;
                // Cho den khi: button ton tai trong DOM + init() chay xong (strHSSV_Id duoc set)
                if ($btn.length && thp && thp.strHSSV_Id) {
                    clearInterval(iv);
                    $btn.trigger('click');
                } else if (iAttempt > 80) {
                    clearInterval(iv); // 80 * 250ms = 20s, bo cuoc
                    console.warn('[CanhBaoNoHocPhi] Khong mo duoc modal No chung sau 20s');
                }
            }, 250);
        }

        function hideModal() {
            var $m = $('#modalCanhBaoNoHocPhi');
            try {
                var ins = bootstrap.Modal.getInstance($m[0]);
                if (ins) ins.hide(); else $m.modal('hide');
            } catch (e) { $m.modal('hide'); }
        }

        function showModalCanhBao(dNo) {
            $('#lblSoTienNoModal').text(formatTien(dNo) + ' đ');
            $('#btnXemHocPhiModal').off('click').on('click', function () {
                hideModal();
                goToHocPhi();
            });
            $('#btnThanhToanModal').off('click').on('click', function () {
                hideModal();
                goToThanhToan();
            });
            try {
                var m = new bootstrap.Modal(document.getElementById('modalCanhBaoNoHocPhi'));
                m.show();
            } catch (e) {
                // Fallback neu khong co bootstrap 5 API
                $('#modalCanhBaoNoHocPhi').modal('show');
            }
        }
    })();
</script>

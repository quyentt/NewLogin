<!-- Modal "Nhac no hoc phi" da chuyen len index.aspx (#modalCanhBaoNoHocPhi_idx)
     de fire som ngay khi edu.system san sang, khong phai doi dashboard load. -->
<a class="hello-user" id="helloUserDb">Xin chào!</a>
<script>
    // Set greeting voi ten user + thoi gian. Logic mirror tu index.aspx.
    // dashboard.html duoc inject vao #main-content-wrapper sau khi index.aspx
    // render xong, nen phai chay lai logic o day (script cua index.aspx khong
    // re-run khi module load).
    (function () {
        var strTen = '';
        try {
            // Lay ten tu #lblHoTenNguoiDangNhap (server render <%=fullname %>).
            // Fallback sang span ben canh avatar trong dropdown navbar neu can.
            strTen = ($('#lblHoTenNguoiDangNhap').text() || '').trim();
            if (!strTen) {
                strTen = ($('.nav-account .dropdown button .user-image').first()
                    .parent().find('> span').first().text() || '').trim();
            }
        } catch (e) {}
        var iGio = parseInt(new Date().toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', hour12: false }), 10);
        var strChao = (iGio >= 5 && iGio < 11) ? 'Chào buổi sáng'
                    : (iGio >= 11 && iGio < 13) ? 'Chào buổi trưa'
                    : (iGio >= 13 && iGio < 18) ? 'Chào buổi chiều'
                    : (iGio >= 18 && iGio < 22) ? 'Chào buổi tối'
                    : 'Chào buổi đêm';
        var el = document.getElementById('helloUserDb');
        if (el) el.textContent = strTen ? (strChao + ', ' + strTen + '!') : (strChao + '!');
    })();
</script>
